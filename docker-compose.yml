# Стенд целиком: docker compose up --build
# Порты на хосте меняются переменными из .env (см. .env.example).

name: new-lct

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lct
      POSTGRES_PASSWORD: lct
      POSTGRES_DB: lct
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lct -d lct"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://lct:lct@db:5432/lct
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-on-deploy}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"

  # Тесты бэкенда во временной базе на сервере db: docker compose run --rm tests
  tests:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://lct:lct@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

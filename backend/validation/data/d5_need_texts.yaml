  text: |
    Стажер-разработчик Python / Junior Backend Developer
    от 20 000 до 40 000 ₽ за месяц до вычета налогов
    Ульяновск, Первомайская улица
    Опыт работы: не требуется
    Формат работы: на месте работодателя

    Компания АЛТ развивает собственные внутренние IT-сервисы для автоматизации бизнес-процессов: логистика, документооборот, отчеты, интеграции с внешними системами, уведомления и внутренние инструменты для сотрудников.

    Сейчас мы ищем стажера-разработчика / младшего Python-разработчика в помощь действующему инженеру-разработчику. Это позиция для человека, который хочет получить реальную практику, работать с живыми задачами бизнеса и развиваться под наставничеством опытного специалиста.

    Компания имеет IT-аккредитацию.

    Чем предстоит заниматься:
    — помогать в разработке и поддержке внутренних сервисов компании;
    — писать скрипты и небольшие backend-сервисы на Python;
    — работать с интеграциями по API: получать данные, отправлять запросы, обрабатывать ответы и ошибки;
    — дорабатывать бизнес-логику внутренних сервисов: очереди, таймауты, правила распределения задач, автоматические действия;
    — работать с базами данных: читать, записывать, сверять данные, помогать искать расхождения;
    — участвовать в подготовке отчетов и выгрузок в Excel;
    — помогать с ботами, уведомлениями, генерацией документов и PDF;
    — разбирать ошибки, читать логи, помогать искать причины сбоев;
    — участвовать в деплое, работе с контейнерами и CI/CD на базовом уровне;
    — делать небольшие правки во frontend при необходимости;
    — участвовать в код-ревью и разборе задач вместе с наставником.

    Что важно для нас:
    — базовое знание Python;
    — понимание ООП;
    — базовое знание SQL;
    — умение читать чужой код и разбираться в логике;
    — аккуратность, внимательность, желание доводить задачи до результата;
    — готовность учиться, задавать вопросы и самостоятельно искать решения;
    — интерес к backend-разработке, автоматизации и интеграциям.

    Будет плюсом опыт или интерес к одному из направлений:
    — backend: FastAPI, Litestar, Django;
    — frontend: React, Vue или базовая верстка;
    — базы данных: PostgreSQL, MongoDB;
    — очереди и кэш: RabbitMQ, Redis;
    — инфраструктура: Linux, Docker, Kubernetes, GitLab CI;
    — аналитика: сложные SQL-запросы, Excel, макросы, отчеты, дашборды.

    Не обязательно знать все сразу. Нам важнее базовая техническая подготовка, логика мышления и желание развиваться.

    Мы предлагаем:
    — заработную плату до 40 000 рублей до вычета НДФЛ;
    — официальное оформление;
    — работу преимущественно в офисе, полный рабочий день;
    — возможность гибко согласовывать учебные вопросы и отработки при необходимости;
    — реальные задачи, а не учебные проекты «в стол»;
    — работу рядом с действующим инженером-разработчиком;
    — возможность освоить backend, интеграции, базы данных и инфраструктуру на практике;
    — участие в создании внутренних IT-продуктов компании;
    — понятные задачи, обратную связь и постепенный рост сложности;
    — стабильную компанию с IT-аккредитацией;
    — возможность профессионального и зарплатного роста внутри компании. Уровень дохода может быть пересмотрен индивидуально после прохождения испытательного срока и по результатам работы.

    Кому подойдет вакансия:
    — студенту технической специальности, в том числе студенту 4 курса;
    — выпускнику, который хочет начать карьеру в разработке;
    — начинающему Python-разработчику;
    — специалисту, который уже писал учебные или pet-проекты и хочет перейти к реальным бизнес-задачам;
    — человеку, которому интересно не просто писать код, а понимать, как IT помогает бизнесу работать быстрее и точнее.

    Будет преимуществом при отклике:
    — ссылка на GitHub / GitLab;
    — описание учебных, pet- или рабочих проектов;
    — примеры кода;
    — опыт работы с API, базами данных или автоматизацией процессов.

    Если вы хотите развиваться в backend-разработке, работать с реальными задачами и получать практический опыт под наставничеством, откликайтесь.

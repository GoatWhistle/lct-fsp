    Мы - это группа компаний К+, куда также входит компания Займиго МКК - холдинг активно растущих компаний, которые объединяют в себе несколько направлений работы: финансы и кредитование, IT продукты, глубокая аналитика, развитый маркетинг и, конечно, клиентский сервис.

    Наша цель - дать людям простой и быстрый доступ к деньгам в любой точке мира. Для этого мы активно разрабатываем новые инструменты и открываем проекты в других странах.


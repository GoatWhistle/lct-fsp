# Справочники MVP. Коды стабильны: на них ссылаются тест, профиль навыков и подбор.
# Код темы — `<специализация>.<тема>`. Порядок в списках — порядок показа.
# После правки: `python -c 'import main; main.sync_catalog()'` (на стенде — при старте бэкенда).

grades:
  - {code: intern, name: Стажёр, rank: 1}
  - {code: junior, name: Junior, rank: 2}
  - {code: middle, name: Middle, rank: 3}
  - {code: senior, name: Senior, rank: 4}

# Сферы бизнеса: деятельность компании и необязательные интересные сферы кандидата. Совпадение —
# признак модели принятия, на категорию не влияет. «Отрасль» из ТЗ — не они, а специализация.
industries:
  - {code: fintech, name: Финтех и банки}
  - {code: e-commerce, name: Электронная коммерция и ритейл}
  - {code: government, name: Госсектор}
  - {code: telecom, name: Телеком}
  - {code: industry, name: Промышленность и энергетика}
  - {code: healthcare, name: Медицина}
  - {code: education, name: Образование}
  - {code: media, name: "Медиа, игры и развлечения"}
  - {code: logistics, name: Транспорт и логистика}
  - {code: it-products, name: ИТ-продукты и аутсорс}

specializations:
  - code: backend
    name: Бэкенд
    topics:
      - {code: backend.programming, name: Язык программирования и стандартная библиотека}
      - {code: backend.algorithms, name: Алгоритмы и структуры данных}
      - {code: backend.databases, name: Базы данных и SQL}
      - {code: backend.api, name: HTTP и проектирование API}
      - {code: backend.concurrency, name: Конкурентность и асинхронность}
      - {code: backend.distributed, name: "Очереди, кэши и распределённые системы"}
      - {code: backend.testing, name: Тестирование}
      - {code: backend.security, name: Безопасность приложений}

  - code: frontend
    name: Фронтенд
    topics:
      - {code: frontend.javascript, name: JavaScript и TypeScript}
      - {code: frontend.markup, name: "HTML, CSS и вёрстка"}
      - {code: frontend.frameworks, name: Компонентные фреймворки и состояние}
      - {code: frontend.browser, name: "Браузер, сеть и производительность"}
      - {code: frontend.algorithms, name: Алгоритмы и структуры данных}
      - {code: frontend.testing, name: Тестирование интерфейсов}

  - code: data-ml
    name: Данные и ML
    topics:
      - {code: data-ml.math, name: "Математика, вероятности и статистика"}
      - {code: data-ml.sql, name: SQL и обработка данных}
      - {code: data-ml.python, name: Python для анализа данных}
      - {code: data-ml.ml, name: Классическое машинное обучение}
      - {code: data-ml.deep-learning, name: Глубокое обучение}
      - {code: data-ml.mlops, name: Внедрение и эксплуатация моделей}

  - code: qa
    name: QA
    topics:
      - {code: qa.theory, name: Теория тестирования и тест-дизайн}
      - {code: qa.api, name: Тестирование API}
      - {code: qa.automation, name: Автоматизация тестирования}
      - {code: qa.databases, name: Базы данных и SQL}
      - {code: qa.performance, name: Нагрузочное тестирование}

  - code: devops
    name: DevOps
    topics:
      - {code: devops.linux, name: Linux и сети}
      - {code: devops.containers, name: Контейнеры и оркестрация}
      - {code: devops.ci-cd, name: CI/CD}
      - {code: devops.iac, name: Инфраструктура как код}
      - {code: devops.observability, name: Мониторинг и логирование}
      - {code: devops.scripting, name: Скрипты и автоматизация}


    12 лет опыта в сфере микрофинансирования, экспертиза в IT, возможности развития и роста, гибкие подходы к работе, выход на международные рынки - и это лишь часть того что можно рассказать о нас!

    Над какими задачами будем работать:

    - Поддержка существующих проектов;
    - Разработка и поддержка компонентов SPA для микрозаймов на Vue3 (Composition API, Options API) и Nuxt 3;
    - Проектирование архитектуры;
    - Работа с состоянием приложения (**Pinia/Vuex**);
    - Работа с Git (GitLab).

    Мы ждем от Вас:

    - опыт в разработке от 4-х лет;
    - Использование UI-библиотек (Vuetify);
    - Уверенная работа с TypeScript так и с ванильным js;
    - Уверенная верстка. БЭМ. Применение принципов Atomic Design;
    - Понимание основ ci/cd : Docker.

    Плюсом будет:

    - умение писать код на TypeScript без any;
    - любой опыт с Node.js (даже не коммерческая разработка);
    - опыт в настройке систем сборки и понимание, чем они отличаются;
    - хороший опыт с Vue (мы используем его);
    - навыки в смежных областях (бэк, бд);
    - желание предлагать и внедрять новые технологии.

    Что мы предлагаем:

    - Официальное трудоустройство по ТК РФ;

    - 8-часовой рабочий день, гибкое начало дня;

    - Обучение за счет компании;

    - Полностью белая з\п;

    - Ежегодная индексация заработной платы.

    + Бонусы:

    - Приобретение курсов для сотрудников;

    - Обеспечение рабочей техникой;

    - Оплачиваемые поездки на профильные конференции;

    - ДМС;

    - Поможем с переездом в Нижний Новгород (По желанию! есть релокационный бонус).

# Вилка: множители после числа и признаки суммы «на руки» — её платформа не пересчитывает, поле
# только подсвечивается. Сумма в другой валюте не берётся. Числа меньше `min_rub` — не зарплата
# («опыт от 3 до 5 лет»).
salary:
  min_rub: 10000
  multipliers:
    1000: [тыс, тысяч, т.р, к, k]
    1000000: [млн, миллион*]
  net: [на руки, net, нетто, после вычета, чистыми]
  foreign: [$, usd, долл*, €, eur, евро]

# Направления вне справочника: честный ответ «такой специализации нет» и ближайшие
# специализации — кнопками на экране.

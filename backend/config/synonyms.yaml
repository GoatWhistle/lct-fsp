    synonyms: [геймдев*, gamedev, game dev, разработчик игр, разработчика игр, разработка игр,
      разработки игр, unity, unreal, геймдизайн*]
    nearest: [backend, frontend]
  - name: Встраиваемые системы
    synonyms: [embedded, встраиваем*, микроконтроллер*, stm32, прошивк*, firmware, rtos, плис, fpga]
    nearest: [backend, devops]
  - name: Мобильная разработка
    synonyms: [ios, android, swift, swiftui, flutter, react native, мобильн*, kotlin multiplatform]
    nearest: [frontend, backend]
  - name: Аналитика и управление продуктом
    synonyms: [системный аналитик*, системного аналитика, бизнес-аналитик*, бизнес аналитик*,
      product manager, продакт*, project manager, проджект*, scrum master, скрам-мастер*]
    nearest: [data-ml, qa]
  - name: Дизайн
    synonyms: [ui/ux, ux/ui, дизайнер*, designer, figma]
    nearest: [frontend]
  - name: Информационная безопасность

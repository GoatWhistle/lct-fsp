[project]
name = "lct-backend"
description = "Бэкенд платформы подбора ИТ-специалистов"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "authlib>=1.6",
    "catboost>=1.2.8",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "fpdf2>=2.8.9",
    "httpx>=0.28",
    "joserfc>=1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "claude-agent-sdk>=0.2.164",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]
# Стенд валидации, B2: эмбеддинги локально. Не в группе по умолчанию — в образы не идёт.
validation = [
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
]

[tool.pytest.ini_options]
# Тесты моделей, которые собираются только по имени, лежат рядом с ними.
testpaths = ["tests", "app/adapter/demo"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m unit"
markers = [
    "unit: без базы и долгих прогонов — идёт по умолчанию",
    "integration: ходит в PostgreSQL — ставится сам по фикстуре базы",
    "simulation: свойство механики на синтетике, долгий прогон",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID251"]
# Тексты по-русски: кириллица — не опечатка в латинице.
ignore = ["RUF001", "RUF002", "RUF003"]

# Фикстура из другого файла тестов подключается импортом и приходит в тест параметром.
[tool.ruff.lint.per-file-ignores]
"tests/test_contact_negative.py" = ["F811"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.create_engine".msg = "движок — через app.repository.database.create_db_engine: время из базы в UTC"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "authlib.*", "catboost.*", "onnxruntime.*"]
ignore_missing_imports = true

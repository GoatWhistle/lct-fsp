    от 250 000 до 450 000 ₽ за месяц до вычета налогов
    Санкт-Петербург, Центральный административный округ, район Хамовники, квартал Красная Роза
    Опыт работы: более 6 лет
    Формат работы: на месте работодателя, удалённо, гибрид

    Яндекс Документы — это один из сервисов экосистемы Яндекс 360, в которую также входят Диск, Почта, Календарь, Телемост, Заметки. Мы делаем продукты для пользователей и для организаций, постоянно работаем над качеством и производительностью и при этом успеваем экспериментировать с новыми технологиями, чтобы сделать наши приложения ещё более удобными и полезными. Ищем сильного фронтенд-разработчика, который поможет нам в этом.

    Какие задачи вас ждут

    Разработка и улучшение продукта вместе с командой
    Мы разрабатываем большой и сложный продукт. Каждый член команды несет большую ценность в общее дело. Предстоит присоединиться к сильной команде разработчиков и наносить большую пользу проекту.

    Реализация сложной бизнес-логики и визуальных компонентов
    У нас не стандартный фронтовый проект "с формами". Большинство задач включает в себя большую "подкапотную" работу, а визульная часть как правило реализуется на Canvas.

    Повышение производительности и качества продукта
    Кроме реализации основного функционала, одной из важных задач которую мы держим всегда в уме – это написание оптимального по размеру и скорости кода.

    Мы ждем, что вы

    - Отлично знаете TypeScript или JavaScript
    - Имеете развитое алгоритмическое мышление
    - Разрабатывали на React или Node.js

    Будет плюсом, если вы

    - Писали модульные или интеграционные тесты
    - Имеете опыт работы с библиотеками визуализации: PixiJS, Three.js, Konva, Paper.js, p5.js
    - Работали с Canvas
    - Разрабатывали высоконагруженные сервисы

    Что мы предлагаем

    - Работу в сильной команде, с которой можно расти
    - Сложные и интересные задачи
    - Возможность влиять на процесс и результат
    - Премии каждые полгода для всех, кто успешно прошёл ревью
    - Гибкий график работы
    - Расширенную программу ДМС, оплату 80% стоимости ДМС для супругов и детей

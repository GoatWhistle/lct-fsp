# Стенд целиком: docker compose up --build
# Порты на хосте меняются переменными из .env (см. .env.example).

name: calibr

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lct
      POSTGRES_PASSWORD: lct
      POSTGRES_DB: lct
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lct -d lct"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # Изображает ФСП ID: OIDC-провайдер с realm тестовых участников ФСП. Realm генерирует
  # backend/fsp_stub.py. Админка — http://localhost:8080/admin (admin / admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Браузер ходит на localhost — этот адрес и `iss` в токенах; бэкенд ходит по имени сервиса.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx384m -XX:MaxMetaspaceSize=192m
    volumes:
      - ./keycloak/realm-fsp-id.json:/opt/keycloak/data/import/realm-fsp-id.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    mem_limit: 768m

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://lct:lct@db:5432/lct
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-on-deploy}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-calibr_session}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FSP_ID_ISSUER: ${FSP_ID_ISSUER:-http://localhost:${KEYCLOAK_PORT:-8080}/realms/fsp-id}
      FSP_ID_SERVER_URL: ${FSP_ID_SERVER_URL:-http://keycloak:8080/realms/fsp-id}
      FSP_ID_CLIENT_ID: ${FSP_ID_CLIENT_ID:-lct-platform}
      FSP_ID_CLIENT_SECRET: ${FSP_ID_CLIENT_SECRET:-dev-only-fsp-id-client-secret}
      FSP_ID_REDIRECT_URI: ${FSP_ID_REDIRECT_URI:-}
      # Разбор потребности из текста: rules по умолчанию, llama — с сервисом llama ниже.
      TEXT_UNDERSTANDING: ${TEXT_UNDERSTANDING:-rules}
      DEMO_MODE: ${DEMO_MODE:-false}
      TEXT_UNDERSTANDING_TIMEOUT_SECONDS: ${TEXT_UNDERSTANDING_TIMEOUT_SECONDS:-10}
      LLAMA_URL: ${LLAMA_URL:-http://llama:8080}
    # Вход по email не ждёт Keycloak: недоступный ФСП ID — понятная ошибка на кнопке.
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks: [default, llm]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Локальная модель для разбора текста — llama-server из llama.cpp на CPU, без сети наружу.
  # Только со своим profile: TEXT_UNDERSTANDING=llama docker compose --profile llama up --build.
  # Файл GGUF кладётся в ./models, имя — LLAMA_MODEL_FILE. Бэкенд его не ждёт: пока модель
  # не ответила, разбор отвечает правилами.
  llama:
    profiles: [llama]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command:
      - --model
      - /models/${LLAMA_MODEL_FILE:-model.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${LLAMA_CTX_SIZE:-8192}"
      - --threads
      - "${LLAMA_THREADS:-8}"
    volumes:
      - ./models:/models:ro
    # Сеть без выхода наружу: до модели доходит только бэкенд, сама она — никуда.
    networks: [llm]
    mem_limit: ${LLAMA_MEM_LIMIT:-16g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 60

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"

  # Тесты бэкенда во временной базе на сервере db: docker compose run --rm --build tests
  tests:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://lct:lct@db:5432/postgres
    volumes:
      - ./docs:/docs:ro  # тест сверяет конфиг механик с docs/parameters.md
      - ./keycloak:/keycloak:ro  # тест сверяет realm export с генератором заглушки ФСП
    depends_on:
      db:
        condition: service_healthy

networks:
  llm:
    internal: true

volumes:
  pgdata:

- id: hh-137467118
  source: https://hh.ru/vacancy/137467118
  date: '2026-10-08'
  checked_by: model
  text: |
    Инженер по автотестированию (Python)
    Казань
    Опыт работы: 1–3 года
    Формат работы: удалённо

    Мы — IBS. Ведущий российский системный интегратор, разработчик цифровых решений для крупнейших компаний и государственного сектора.

    Вы присоединитесь к команде, работающей над масштабной HR-платформой — экосистемой для управления персоналом: от подбора и обучения до постановки задач, управления отпусками и больничными. Продукт развивается как внутренняя система с выходом на рынок в модели cloud.

    Это сложная ERP-система, состоящая из множества сервисов. Тестирование ведется как на фронтенде, так и на бэкенде, но ключевая задача — проверка бэкенда: API, интеграции, базы данных, бизнес-логика. Нужен специалист, который умеет и тестировать вручную, и писать автотесты на Python (PyTest).

    Ваши задачи:

    - Составление тест-кейсов по функционалу (анализ требований, проектирование тестов).

    - Проведение ручного тестирования: проверка нового функционала и регрессионное тестирование.

    - Автоматизация тест-кейсов на Python (PyTest).

    - Тестирование API — проверка контрактов между сервисами, работа с JSON.

    - Написание и выполнение SQL-запросов для проверки данных в БД.

    - Анализ логов (Kibana) для поиска причин ошибок.

    - Взаимодействие с разработчиками и аналитиками для уточнения требований.

    Наши ожидания:

    - От 6 месяцев коммерческого опыта автоматизированного тестирования.
    - Преобладание опыта тестирования backend (API, JSON, SQL, DevTools) — это ключевое требование.

    - PyTest: уверенное знание библиотеки (фикстуры, параметризация, маркеры, фикстуры).

    - Общее владение Python: циклы, базовые алгоритмы, типы данных, методы и функции, классы.

    - Владение базовыми запросами к БД (как минимум до JOIN из нескольких таблиц).

    - Умение описывать и создавать тест-кейсы для автоматизации.

    - Навык интеграционного тестирования.

    - Навык чтения логов (у нас Kibana).

    - Понимание клиент-серверной архитектуры.


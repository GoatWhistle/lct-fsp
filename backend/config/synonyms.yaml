# Словарь синонимов для разбора потребности и резюме из текста на правилах
# (app/adapter/text_rules.py).
# Коды — из catalog.yaml; названия записей справочника узнаются и без этого файла.
#
# Синоним — целое слово или фраза: «go» не найдётся в «google», «java» — в «javascript». Звёздочка
# в конце — основа слова: «удален*» найдёт «удалённо» и «удалёнка». Регистр и «ё» не важны.
#
# Словарь подбирается по своим примерам, а не по набору D5: D5 отложенный (docs/adr/0002).

specializations:
  backend: [бэкенд*, бекенд*, бэк-енд*, бэкэнд*, backend, back-end, серверн*, python-разработчик*,
    java-разработчик*, go-разработчик*, golang-разработчик*, php-разработчик*, kotlin-разработчик*,
    .net-разработчик*, c#-разработчик*, node.js-разработчик*, разработчик python, разработчика python,
    разработчик java, разработчика java, разработчик go, разработчика go]
  frontend: [фронтенд*, фронтэнд*, фронт-енд*, frontend, front-end, верстальщик*, react-разработчик*,
    vue-разработчик*, angular-разработчик*, javascript-разработчик*, typescript-разработчик*,
    разработчик интерфейсов, разработчика интерфейсов, ui-разработчик*]
  data-ml: [data scientist, data science, дата-сайентист*, датасайентист*, machine learning,
    машинного обучения, машинное обучение, машинным обучением, ml-инженер*, ml engineer,
    ml-разработчик*, data engineer, инженер данных, инженера данных, дата-инженер*, аналитик данных,
    аналитика данных, data analyst, nlp, computer vision, компьютерного зрения, компьютерное зрение]
  qa: [тестировщик*, тестирован*, qa, quality assurance, автотест*, автоматизатор*, sdet, aqa]
  devops: [devops, девопс*, sre, site reliability, инженер инфраструктуры, инженера инфраструктуры,
    системный администратор*, системного администратора, сисадмин*, platform engineer]

grades:
  intern: [стажер*, стажёр*, стажировк*, intern, internship, практикант*, trainee]
  junior: [junior, джун*, джуниор*, младш*, начинающ*]
  middle: [middle, мидл*, миддл*]
  senior: [senior, сеньор*, синьор*, сеньёр*, старш*, ведущ*, lead, тимлид*, техлид*, team lead]

# Стаж в годах, начиная с которого текст «опыт от N лет» говорит о грейде. Грейд по стажу —
# неуверенный: стаж не равен уровню. Те же пороги и слова `grades` — у подсказки грейда по стажу
# и ролям кандидата (app/domain/resume_draft.py).
experience_years:
  junior: 1
  middle: 3
  senior: 5

